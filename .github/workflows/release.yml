name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: New preview version tag (for example v0.1.1-preview)
        required: true
        default: v0.1.1-preview

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test battery formats
        shell: powershell
        run: .\test.ps1
      - name: Build portable widget
        shell: powershell
        run: .\build.ps1
      - name: Package preview
        shell: powershell
        run: |
          .\package.ps1
      - name: Publish preview
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-preview[.0-9]*$') { throw 'Use a new preview tag such as v0.1.1-preview' }
          if ($env:RELEASE_TAG -ne 'v0.1.1-preview') { throw 'Update app and package versions together before publishing another version.' }
          gh release create $env:RELEASE_TAG release/0.1.1-preview/VoltHUD-windows.zip release/0.1.1-preview/VoltHUD.exe release/0.1.1-preview/SHA256SUMS.txt release/0.1.1-preview/RELEASE_NOTES.md --target $env:GITHUB_SHA --prerelease --title "VoltHUD $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
